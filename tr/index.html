<style>:root{--bg:#F4F2ED;--paper:#FFFFFF;--ink:#1C2024;--ink-3:#7A828A;--line:#D9D5CC;--accent:#C2541D;--steel:#2B4A66}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#15181B;--paper:#1D2125;--ink:#ECEBE6;--ink-3:#868D94;--line:#353B41;--accent:#EE7A43;--steel:#9CB9D4}}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding:24px 16px 40px}
.card{max-width:420px;margin:0 auto;background:var(--paper);border:1px solid var(--line);border-top:5px solid var(--accent);padding:28px 22px 18px;text-align:center}
.photo{width:132px;height:132px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 2px var(--line)}

.role{color:var(--steel);font-weight:600;margin:0}
.tag{color:var(--ink-3);font-size:14px;margin:6px 0 20px}
.btn{display:flex;align-items:center;gap:12px;width:100%;padding:13px 16px;margin:0 0 10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);text-decoration:none;font-size:16px;text-align:left}
.btn svg{flex:0 0 22px;width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn small{display:block;color:var(--ink-3);font-size:13px}
.save{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.save small{color:#fff;opacity:.85}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row .btn{justify-content:center;text-align:center}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}
.lang{font-size:14px;margin:8px 0 0}.lang a{color:var(--ink-3)}</style>
